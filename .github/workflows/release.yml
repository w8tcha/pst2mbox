name: release

on:
  workflow_run:
    workflows:
      - build dotnet
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get version from csproj
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 -oE '<Version>[^<]+</Version>' src/Pst2Mbox.csproj | sed -E 's/<\/?Version>//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET SDK
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: dotnet publish src/Pst2Mbox.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Create zip archive
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "Pst2Mbox-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" "Pst2Mbox-${{ steps.version.outputs.version }}-win-x64.zip" --repo $env:GITHUB_REPOSITORY --title "Pst2Mbox ${{ steps.version.outputs.tag }}" --generate-notes
